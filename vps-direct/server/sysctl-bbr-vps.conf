# Network tuning for high-BDP transpacific proxy VPS (e.g., US West / 100Mbps+ WAN)
# Place at: /etc/sysctl.d/99-vps-network-tuning.conf
# Enable tcp_bbr on boot: echo "tcp_bbr" > /etc/modules-load.d/bbr.conf
# Apply immediately: modprobe tcp_bbr && sysctl -p /etc/sysctl.d/99-vps-network-tuning.conf

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_notsent_lowat = 16384
