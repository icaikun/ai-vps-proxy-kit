# FlClash (Android / Mihomo) — Self-Contained Direct VPS Template
# Primary: VLESS-Reality (TCP 443) | Fast Alt: Hysteria2 (UDP 443)
# Replace <YOUR_*> placeholders before importing into FlClash.
# Note: Android allows only one active VPN at a time, so public 443 Reality/Hy2 works directly on 4G/5G/Wi-Fi without Tailscale.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.<YOUR_PRIVATE_DOMAIN>'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.<YOUR_PRIVATE_DOMAIN>':
      - 223.5.5.5
      - 119.29.29.29
    'geosite:cn,private':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: VPS-Reality
    type: vless
    server: "<YOUR_VPS_IP>"
    port: 443
    uuid: "<YOUR_UUID>"
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "<YOUR_REALITY_PUBLIC_KEY>"
      short-id: "<YOUR_REALITY_SHORT_ID>"

  - name: VPS-Hy2
    type: hysteria2
    server: "<YOUR_VPS_IP>"
    port: 443
    password: "<YOUR_HY2_STRONG_PASSWORD>"
    sni: bing.com
    skip-cert-verify: true
    up: "30 Mbps"
    down: "100 Mbps"

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动容灾 (VPS)
      - VPS-Reality
      - VPS-Hy2
      - DIRECT

  - name: ⚡ 自动容灾 (VPS)
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    proxies:
      - VPS-Reality
      - VPS-Hy2

  - name: 🤖 AI 专线
    type: select
    proxies:
      - ⚡ 自动容灾 (VPS)
      - VPS-Reality
      - VPS-Hy2

rules:
  - DOMAIN-SUFFIX,<YOUR_PRIVATE_DOMAIN>,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
